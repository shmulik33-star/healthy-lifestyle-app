name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build web
        run: flutter build web --release

      # All pull requests share one stable Cloudflare preview hostname.
      # This keeps Flutter Web local storage (SharedPreferences) on the same origin
      # while we move between PRs during manual testing.
      - name: Deploy Cloudflare Pages preview
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=healthy-lifestyle-app --branch=preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test preview runtime
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          check_endpoint() {
            local endpoint="$1"
            local label="$2"
            local response=""
            for attempt in {1..12}; do
              response="$(curl --silent --show-error --fail "$endpoint" || true)"
              if echo "$response" | grep -q '"status":"ok"' && \
                 echo "$response" | grep -q '"aiBinding":true'; then
                echo "$label runtime smoke test passed."
                return 0
              fi
              echo "$label endpoint not ready yet (attempt $attempt/12)."
              sleep 5
            done
            echo "$label runtime smoke test failed. Last response: $response"
            return 1
          }
          check_endpoint "https://preview.healthy-lifestyle-app.pages.dev/api/equipment-recognize" "Equipment preview"
          check_endpoint "https://preview.healthy-lifestyle-app.pages.dev/api/nutrition-label-recognize" "Nutrition-label preview"

      - name: Set main as Cloudflare production branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --fail-with-body --request PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/healthy-lifestyle-app" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"production_branch":"main"}'

      - name: Deploy Cloudflare Pages production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=healthy-lifestyle-app --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test production runtime
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          check_endpoint() {
            local endpoint="$1"
            local label="$2"
            local response=""
            for attempt in {1..12}; do
              response="$(curl --silent --show-error --fail "$endpoint" || true)"
              if echo "$response" | grep -q '"status":"ok"' && \
                 echo "$response" | grep -q '"aiBinding":true'; then
                echo "$label runtime smoke test passed."
                return 0
              fi
              echo "$label endpoint not ready yet (attempt $attempt/12)."
              sleep 5
            done
            echo "$label runtime smoke test failed. Last response: $response"
            return 1
          }
          check_endpoint "https://healthy-lifestyle-app.pages.dev/api/equipment-recognize" "Equipment production"
          check_endpoint "https://healthy-lifestyle-app.pages.dev/api/nutrition-label-recognize" "Nutrition-label production"
